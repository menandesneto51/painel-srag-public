name: Validate public SRAG snapshot

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: validate-srag-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  code-and-data-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python
        run: |
          python -m py_compile \
            app_publico_streamlit.py \
            app_review_streamlit.py \
            public_data_validation.py \
            scripts/validate_public_data.py \
            scripts/enforce_publication_policy.py \
            scripts/download_official_sources.py \
            scripts/build_population_reference.py \
            scripts/rebuild_risk_incidence.py \
            scripts/build_sivep_mt_aggregates.py \
            scripts/download_sivep_history.py \
            scripts/build_historical_panel.py \
            scripts/build_baseline_signals.py \
            scripts/build_confidence_silence.py \
            scripts/run_p2_pipeline.py \
            scripts/backtest_p2_signals.py \
            scripts/build_territorial_intelligence.py \
            scripts/build_territorial_review_cards.py \
            scripts/sanitize_healthcare_pressure.py \
            scripts/build_operational_review.py \
            scripts/create_human_review_template.py \
            scripts/validate_human_review_decisions.py \
            scripts/build_operational_actions.py \
            scripts/build_state_operational_brief.py \
            scripts/run_v2_2_pipeline.py \
            scripts/capture_operational_vintage.py \
            scripts/compare_operational_vintages.py \
            scripts/analyze_operational_stability.py \
            scripts/create_decision_audit_template_v2_5.py \
            scripts/validate_decision_audit_v2_5.py \
            scripts/create_follow_up_template_v2_5.py \
            scripts/validate_follow_up_v2_5.py \
            scripts/build_quality_metrics.py \
            scripts/build_public_snapshot_v2.py \
            scripts/build_associations.py \
            scripts/build_virology_metrics.py \
            scripts/estimate_stability.py \
            scripts/capture_vintage.py \
            scripts/backtest_vintages.py \
            scripts/check_sivep_source.py \
            scripts/approve_candidate_snapshot.py \
            scripts/promote_snapshot.py \
            src/associations.py \
            src/baseline_signals.py \
            src/epi_calendar.py \
            src/quality_metrics.py \
            src/p2_backtest.py \
            src/risk_model.py \
            src/signal_confidence.py \
            src/silence_signals.py \
            src/stability.py \
            src/territorial_intelligence.py \
            src/territorial_review_cards.py \
            src/healthcare_pressure_bridge.py \
            src/human_review_decisions.py \
            src/operational_review.py \
            src/operational_persistence.py \
            src/operational_stability.py \
            src/decision_audit_v2_5.py \
            src/decision_followup_v2_5.py \
            src/operational_actions.py \
            src/operational_brief.py \
            src/state_review_report.py \
            src/vintage_backtest.py \
            src/virology.py \
            src/sivep_pipeline.py \
            tests/test_associations.py \
            tests/test_baseline_signals.py \
            tests/test_confidence_silence.py \
            tests/test_epi_calendar.py \
            tests/test_historical_panel.py \
            tests/test_p2_backtest.py \
            tests/test_public_data_validation.py \
            tests/test_public_snapshot_builder.py \
            tests/test_quality_metrics.py \
            tests/test_risk_model.py \
            tests/test_sivep_pipeline.py \
            tests/test_sivep_pipeline_integration.py \
            tests/test_sivep_source_watch.py \
            tests/test_snapshot_promotion.py \
            tests/test_stability.py \
            tests/test_territorial_intelligence.py \
            tests/test_territorial_review_cards.py \
            tests/test_healthcare_pressure_bridge.py \
            tests/test_human_review_decisions.py \
            tests/test_operational_review.py \
            tests/test_operational_persistence.py \
            tests/test_operational_stability.py \
            tests/test_decision_audit_v2_5.py \
            tests/test_operational_actions.py \
            tests/test_operational_brief.py \
            tests/test_operational_v2_2_integration.py \
            tests/test_vintage_backtest.py \
            tests/test_virology.py

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Print epidemiological validation report
        run: python scripts/validate_public_data.py || true

      - name: Enforce publication policy
        run: python scripts/enforce_publication_policy.py
