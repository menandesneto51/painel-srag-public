            src/candidate_rule_queue_v2_7.py \
            src/rule_shadow_evaluation_v2_7.py \
            src/rule_shadow_evaluation_report_v2_7.py \
            src/operational_actions.py \
            src/operational_brief.py \
            src/state_review_report.py \
            src/vintage_backtest.py \
            src/virology.py \
            src/sivep_pipeline.py \
            tests/test_associations.py \
            tests/test_baseline_signals.py \
            tests/test_confidence_silence.py \
            tests/test_epi_calendar.py \
            tests/test_historical_panel.py \
            tests/test_p2_backtest.py \
