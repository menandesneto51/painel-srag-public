name: Validate public SRAG snapshot

on:
  pull_request:
  push:
    branches:
      - main
      - v2-saneamento-epidemiologico

permissions:
  contents: read

jobs:
  code-and-data-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python
        run: |
          python -m py_compile             app_publico_streamlit.py             public_data_validation.py             scripts/validate_public_data.py             tests/test_public_data_validation.py

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Validate public snapshot
        run: python scripts/validate_public_data.py
