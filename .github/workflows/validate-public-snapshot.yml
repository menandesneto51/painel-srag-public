            tests/test_deployment_verification_v2_12.py \
            tests/test_deployment_verification_report_v2_12.py \
            tests/test_rollback_governance_v2_13.py \
            tests/test_rollback_report_v2_13.py \
            tests/test_candidate_rule_queue_v2_7.py \
            tests/test_rule_shadow_evaluation_v2_7.py \
            tests/test_rule_shadow_evaluation_report_v2_7.py \
            tests/test_review_app_structure.py \
            tests/test_operational_actions.py \
            tests/test_operational_brief.py \
            tests/test_operational_v2_2_integration.py \
            tests/test_vintage_backtest.py \
            tests/test_virology.py

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Print epidemiological validation report
        run: python scripts/validate_public_data.py || true

      - name: Enforce publication policy
        run: python scripts/enforce_publication_policy.py
